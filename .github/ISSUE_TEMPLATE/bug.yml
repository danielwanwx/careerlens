name: Bug report
description: Report a reproducible validation, rendering, or onboarding failure.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include resumes, contact details, credentials, or employer-confidential material.
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include the command, expected result, and actual result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Use synthetic or redacted input only.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CareerLens version or commit
      placeholder: v0.1.0 or a commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Python version and operating system
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed all private candidate and employer-confidential information.
          required: true
