name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python skill/careerlens/scripts/validate_runbook.py examples/source-backed.example.json --strict
      - run: python skill/careerlens/scripts/validate_runbook.py examples/thin-input.example.json --strict
      - run: python -m compileall -q skill tests
