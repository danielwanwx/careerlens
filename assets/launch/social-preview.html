<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box}html,body{width:1280px;height:640px;margin:0;overflow:hidden}body{background:#101827;color:#f8fafc;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;position:relative;padding:64px 72px}body:before{content:"";position:absolute;width:600px;height:600px;border:1px solid rgba(148,163,184,.18);border-radius:50%;right:-230px;top:-260px;box-shadow:0 0 0 86px rgba(255,255,255,.025),0 0 0 172px rgba(255,255,255,.015)}.brand{font-size:28px;font-weight:850;letter-spacing:-.04em}.eyebrow{margin-top:72px;color:#7dd3fc;font:700 15px ui-monospace,SFMono-Regular,monospace;letter-spacing:.13em;text-transform:uppercase}.headline{font-size:68px;font-weight:800;line-height:.98;letter-spacing:-.055em;margin-top:20px;max-width:950px}.footer{position:absolute;left:72px;bottom:52px;display:flex;align-items:center;gap:16px;font-size:20px;color:#cbd5e1}.dot{width:12px;height:12px;background:#fbbf24;border-radius:50%;box-shadow:0 0 20px #fbbf24}.states{position:absolute;right:72px;bottom:48px;display:flex;gap:8px}.state{padding:9px 13px;border:1px solid #475569;border-radius:999px;font:700 12px ui-monospace,SFMono-Regular,monospace;text-transform:uppercase;letter-spacing:.06em}.proved{color:#86efac}.claimed{color:#fde68a}.missing{color:#fda4af}.unknown{color:#c4b5fd}
</style>
</head>
<body>
<div class="brand">CareerLens</div>
<div class="eyebrow">Evidence-bounded career diagnosis for Codex</div>
<div class="headline">Strong AI experience.<br>Three decisive gaps.</div>
<div class="footer"><span class="dot"></span><strong>Conditional fit</strong><span>· no invented experience · no numeric score</span></div>
<div class="states"><span class="state proved">proved</span><span class="state claimed">claimed</span><span class="state missing">missing</span><span class="state unknown">unknown</span></div>
</body>
</html>
